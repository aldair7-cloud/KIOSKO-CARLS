<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de Pedidos — Carl's Jr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #CC0000;
      --yellow: #FFC82C;
      --black: #0F0F0F;
      --dark: #181818;
      --green: #22c55e;
      --card-bg: #1a1a1a;
      --border-radius: 18px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ── CANVAS CONFETTI ── */
    #confetti-canvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px 12px;
      border-bottom: 2px solid #222;
      position: relative;
      z-index: 10;
      background: var(--black);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-wrap img {
      height: 48px;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
    }

    .header-eyebrow {
      font-family: 'Anton', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--yellow);
      text-transform: uppercase;
      line-height: 1;
    }

    .header-title {
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      color: #fff;
      line-height: 1.1;
    }

    .demo-link {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      text-decoration: none;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 12px;
      transition: color .2s, border-color .2s;
      letter-spacing: .5px;
    }

    .demo-link:hover { color: var(--yellow); border-color: var(--yellow); }

    /* ── TICKER STRIP ──
       INC-18: el banner queda fijo. Antes se desplazaba y el contenido se
       veía incompleto. */
    .ticker {
      background: var(--red);
      overflow: hidden;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    .ticker-track {
      display: block;
      font-family: 'Anton', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* ── SPLIT BOARD ── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 110px);
      overflow: hidden;
    }

    .split-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-col-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px 14px;
      border-bottom: 2px solid #1a1a1a;
    }

    .split-col-icon { font-size: 22px; }

    .split-col-title {
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .split-col-badge {
      font-size: .7rem; font-weight: 800;
      padding: 3px 9px; border-radius: 100px;
    }

    .col-preparing { border-right: 1px solid #1a1a1a; background: #0f0f0f; }
    .col-preparing .split-col-title { color: #ff6600; }
    .col-preparing .split-col-badge { background: rgba(204,0,0,.2); color: #ff6600; }

    .col-ready { background: #0a1410; }
    .col-ready .split-col-title { color: var(--green); }
    .col-ready .split-col-badge { background: rgba(34,197,94,.2); color: var(--green); }

    .split-col-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-content: start;
      gap: 8px;
    }

    /* INC-15: sin pedidos, la promo ocupa el tablero entero y las columnas
       se ocultan en vez de quedar recortadas debajo. */
    main.is-empty { grid-template-columns: 1fr; }
    main.is-empty .split-col { display: none; }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 22px;
      text-align: center;
      grid-column: 1 / -1;
    }

    .empty-burger {
      font-size: 96px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-18px) rotate(3deg); }
    }

    .empty-headline {
      font-family: 'Anton', sans-serif;
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.1;
      color: #fff;
    }

    .empty-sub {
      font-size: 16px;
      color: #555;
      max-width: 320px;
    }

    .col-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: #333;
      font-size: .9rem;
    }

    /* ── ORDERS GRID ── */
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    /* ── ORDER CARD ── */
    .order-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 8px 10px 6px;
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
      transition: transform .3s, box-shadow .3s;
    }

    /* Preparing */
    .order-card.preparing {
      border-color: var(--red);
      animation: fire-border 1s ease-in-out infinite alternate;
    }

    @keyframes fire-border {
      0%   { box-shadow: 0 0 14px -2px rgba(204,0,0,.5), 0 0 30px -8px rgba(255,100,0,.3); }
      100% { box-shadow: 0 0 28px 4px  rgba(204,0,0,.7), 0 0 50px 0px rgba(255,140,0,.5); }
    }

    /* Ready */
    .order-card.ready {
      border-color: var(--green);
      animation: pulse-green 1.1s ease-in-out infinite, shake-ready 6s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 22px -4px rgba(34,197,94,.4); }
      50%       { box-shadow: 0 0 40px 6px  rgba(34,197,94,.7); }
    }

    @keyframes shake-ready {
      0%,  90%, 100% { transform: translateX(0); }
      92%            { transform: translateX(-5px); }
      94%            { transform: translateX(5px); }
      96%            { transform: translateX(-4px); }
      98%            { transform: translateX(4px); }
    }

    /* ── SHIMMER OVERLAY for preparing ── */
    .order-card.preparing::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg,
        transparent 30%,
        rgba(255,100,0,.07) 50%,
        transparent 70%);
      background-size: 200% 100%;
      animation: shimmer 1.6s linear infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* ── CARD HEADER ── */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-number {
      font-family: 'Anton', sans-serif;
      font-size: clamp(24px, 5vw, 36px);
      line-height: 1;
      letter-spacing: -1px;
    }

    .order-number.preparing { color: var(--red); }
    .order-number.ready     { color: var(--green); }

    .card-meta {
      text-align: right;
    }

    .time-elapsed {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
    }

    .status-icon {
      font-size: 18px;
      display: block;
      text-align: right;
    }

    .status-icon.preparing {
      animation: flicker 0.5s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      0%   { opacity: 1;    transform: scale(1); }
      100% { opacity: 0.7;  transform: scale(1.12); }
    }

    .status-icon.ready {
      animation: star-burst 1.2s ease-in-out infinite;
    }

    @keyframes star-burst {
      0%,100% { transform: scale(1) rotate(0deg); }
      50%      { transform: scale(1.25) rotate(15deg); }
    }

    /* ── STATUS TEXT ── */
    .status-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 3px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-label.preparing { color: #ff6600; }
    .status-label.ready     { color: var(--green); font-size: 11px; }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      background: #2a2a2a;
      border-radius: 100px;
      height: 4px;
      overflow: hidden;
      margin-bottom: 0;
    }

    .progress-bar {
      height: 100%;
      border-radius: 100px;
      transition: width 0.8s cubic-bezier(.4,0,.2,1), background-color 0.6s ease;
    }

    .progress-bar.preparing { width: 66%; background: var(--red); animation: bar-glow-red 1s ease-in-out infinite alternate; }
    .progress-bar.ready     { width: 100%; background: var(--green); }

    @keyframes bar-glow-red {
      0%   { box-shadow: none; }
      100% { box-shadow: 0 0 10px 2px rgba(204,0,0,.6); }
    }

    /* ── ITEMS LIST ── */
    .items-divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin-bottom: 4px;
    }

    .items-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .items-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #bbb;
    }

    .item-qty {
      font-family: 'Anton', sans-serif;
      font-size: 11px;
      color: var(--yellow);
      min-width: 16px;
    }

    .item-name {
      flex: 1;
    }

    .item-mods {
      font-size: 10px;
      color: #555;
    }

    /* ── READY BADGE ── */
    .ready-badge {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--green);
      color: #000;
      font-family: 'Anton', sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      border-radius: 100px;
      text-transform: uppercase;
    }

    .order-card.ready .ready-badge { display: block; }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- HEADER -->
<header>
  <div class="logo-wrap">
    <img
      src="./logo-carlsjr.png"
      alt="Carl's Jr"
      referrerpolicy="no-referrer"
      onerror="this.style.display='none'"
    />
    <div>
      <div class="header-eyebrow">Bigger. Better. Burgers.</div>
      <div class="header-title">Estado de Pedidos</div>
    </div>
  </div>
  <a href="./index.html" class="demo-link">⬡ Demo</a>
</header>

<!-- TICKER -->
<div class="ticker" aria-hidden="true">
  <span class="ticker-track">
    🔥 CARL'S JR &nbsp;·&nbsp; BIGGER BETTER BURGERS &nbsp;·&nbsp; ¡PEDIDO FRESCO PARA TI!
  </span>
</div>

<!-- MAIN BOARD -->
<main id="main-board">
  <div class="split-col col-preparing">
    <div class="split-col-header">
      <span class="split-col-icon">🔥</span>
      <span class="split-col-title">En preparación</span>
      <span class="split-col-badge" id="badge-preparing">0</span>
    </div>
    <div class="split-col-list" id="board-preparing"></div>
  </div>
  <div class="split-col col-ready">
    <div class="split-col-header">
      <span class="split-col-icon">⭐</span>
      <span class="split-col-title">Listos para recoger</span>
      <span class="split-col-badge" id="badge-ready">0</span>
    </div>
    <div class="split-col-list" id="board-ready"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="./sync.js"></script>
<script>
'use strict';

/* ── CONFIG ── */
const STORAGE_KEY    = 'cj-kds-orders';
const READY_TTL      = 5 * 60 * 1000; // 5 min
const POLL_INTERVAL  = 3000;

/* ── STATE ── */
let lastSig       = '';
let confettiActive = false;
let prevReadyIds  = new Set();

/* ── BROADCAST ── */
let bc;
try {
  bc = new BroadcastChannel('cj-kds');
  bc.onmessage = () => refresh();
} catch (e) {}

window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY) refresh();
});

/* ── UTILITIES ── */
// INC-14: descarta IDs alfanuméricos y pedidos bloqueados de sesiones anteriores.
function readOrders() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return CJSync.activeOrders(raw);
  } catch { return []; }
}

function filterOrders(orders) {
  const now = Date.now();
  return orders.filter(o => {
    if (o.status === 'ready') {
      return (now - (o.readyAt || o.timestamp)) < READY_TTL;
    }
    return o.status === 'preparing' || o.status === 'pending';
  });
}

const PREP_SECS = 4 * 60; // tiempo estimado de preparación (4 min desde que cocina empieza)

function eta(order) {
  if (order.status === 'ready') return '¡A recoger!';
  const start = order.preparingAt || order.timestamp;
  const remaining = PREP_SECS - Math.floor((Date.now() - start) / 1000);
  if (remaining <= 30)  return '¡En seguida!';
  if (remaining <= 90)  return '~1 min';
  return `~${Math.ceil(remaining / 60)} min`;
}

function sig(orders) {
  return orders.map(o => `${o.id}:${o.status}`).join('|');
}

/* ── STATUS META ── */
function statusMeta(status) {
  if (status === 'pending')   return { icon: '🔥', label: 'Pedido recibido, en breve empezamos' };
  if (status === 'preparing') return { icon: '🔥', label: '¡Lo estamos preparando!' };
  if (status === 'ready')     return { icon: '⭐', label: '¡LISTO!' };
  return { icon: '❓', label: status };
}

/* ── RENDER ── */
function renderEmpty() {
  return `
    <div class="empty-state">
      <div class="empty-burger" aria-hidden="true">🍔</div>
      <div class="empty-headline">¡Haz tu pedido<br>en el kiosco!</div>
      <div class="empty-sub">Cuando realices un pedido aparecerá aquí en tiempo real.</div>
    </div>`;
}

function renderCard(order) {
  const meta = statusMeta(order.status);

  return `
    <article class="order-card ${order.status}" data-id="${order.id}">
      <span class="ready-badge">¡Listo!</span>
      <div class="card-top">
        <div class="order-number ${order.status}">#${order.id}</div>
        <div class="card-meta">
          <span class="time-elapsed">${eta(order)}</span>
          <span class="status-icon ${order.status}" aria-hidden="true">${meta.icon}</span>
        </div>
      </div>
      <div class="status-label ${order.status}">${meta.label}</div>
      <div class="progress-wrap">
        <div class="progress-bar ${order.status}"></div>
      </div>
    </article>`;
}

function refresh() {
  const all    = readOrders();
  const orders = filterOrders(all);
  const newSig = sig(orders);

  updateEta(orders);

  if (newSig === lastSig) return;
  lastSig = newSig;

  const bPreparing = document.getElementById('board-preparing');
  const bReady     = document.getElementById('board-ready');
  const main       = document.getElementById('main-board');

  const preparing = orders.filter(o => o.status === 'preparing' || o.status === 'pending');
  const ready     = orders.filter(o => o.status === 'ready');

  document.getElementById('badge-preparing').textContent = preparing.length;
  document.getElementById('badge-ready').textContent     = ready.length;

  if (!orders.length) {
    bPreparing.innerHTML = '';
    bReady.innerHTML     = '';
    /* INC-15: las columnas se ocultan mientras no hay pedidos. Antes se añadía
       la promo como tercer elemento de la rejilla de 2 columnas, lo que
       recortaba "En preparación" / "Listos para recoger" y las tapaba. */
    main.classList.add('is-empty');
    if (!main.querySelector('.empty-state')) {
      const emp = document.createElement('div');
      emp.className = 'empty-state';
      emp.innerHTML = `
        <div class="empty-burger" aria-hidden="true">🍔</div>
        <div class="empty-headline">¡Haz tu pedido<br>en el kiosco!</div>
        <div class="empty-sub">Cuando realices un pedido aparecerá aquí en tiempo real.</div>`;
      main.appendChild(emp);
    }
    prevReadyIds = new Set();
    return;
  }

  // Vuelven los pedidos: se restauran las columnas y se quita la promo
  main.classList.remove('is-empty');
  const emp = main.querySelector('.empty-state');
  if (emp) emp.remove();

  bPreparing.innerHTML = preparing.length
    ? preparing.map(renderCard).join('')
    : '<div class="col-empty">Ningún pedido en preparación</div>';

  bReady.innerHTML = ready.length
    ? ready.map(renderCard).join('')
    : '<div class="col-empty">Ningún pedido listo aún</div>';

  // Detect newly-ready orders → confetti
  const currentReadyIds = new Set(ready.map(o => o.id));
  const newlyReady = [...currentReadyIds].filter(id => !prevReadyIds.has(id));
  if (newlyReady.length) fireConfetti();
  prevReadyIds = currentReadyIds;
}

function updateEta(orders) {
  orders.forEach(o => {
    const card = document.querySelector(`.order-card[data-id="${o.id}"]`);
    if (card) {
      const el = card.querySelector('.time-elapsed');
      if (el) el.textContent = eta(o);
    }
  });
}

/* ── CONFETTI ── */
const canvas  = document.getElementById('confetti-canvas');
const ctx     = canvas.getContext('2d');
let particles = [];
let rafId     = null;

/* INC-17: efecto de confeti retirado. Se conserva la función como no-op
   para no romper las llamadas existentes. */
function fireConfetti() {
  confettiActive = false;
  particles = [];
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

window.addEventListener('resize', () => {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* ── POLL ── */
/* ── SYNC ── */
const _fbActive = CJSync.onOrdersChange(() => refresh());
if (!_fbActive) {
  // Fallback mismo dispositivo
  window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) refresh(); });
  try { new BroadcastChannel('cj-kds').onmessage = () => refresh(); } catch(_) {}
  setInterval(() => refresh(), POLL_INTERVAL);
}

/* ── INIT ── */
refresh();
</script>
</body>
</html>
